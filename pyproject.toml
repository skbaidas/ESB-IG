### ESB/IG sub-system — project, packaging and toolchain configuration.
#
# THE SOURCE LAYOUT AND THE DISTRIBUTED IMPORT NAME ARE TWO DIFFERENT CHOICES,
# and conflating them was a real defect in this file's first version. Both:
#
#   distribution           esb-ig            (`[project] name`, below)
#   source directory       backend/esb_ig/   (the tree; `check_boundary.py` scans it)
#   DISTRIBUTED IMPORT     esb_ig            (top-level — what a consumer writes)
#
# THE IMPORT NAME IS NOT `backend.esb_ig`, AND THE REASON IS MEASURED RATHER THAN
# ARGUED. CTM ships `backend/__init__.py`, which makes `backend` a REGULAR
# package rather than a PEP 420 namespace package. Python then fixes
# `backend.__path__` to CTM's own directory and never searches the rest of
# `sys.path` for `backend.*` submodules, so an installed distribution providing
# `backend/esb_ig/` is unreachable from inside CTM. Measured, not reasoned about:
#
#     sys.path = ['a', 'b']         # a/backend/__init__.py exists
#                                   # b/backend/esb_ig/__init__.py exists
#     import backend
#     backend.__path__              -> only the copy under 'a'; 'b' is never searched
#     import backend.esb_ig
#     ImportError: No module named 'backend.esb_ig'
#
# So `from backend.esb_ig import ...` in CTM's `backend/wiring/` would fail the
# moment CTM deletes its seed and pins this repository as a dependency — the
# graduation would not build. The alternative fix, deleting CTM's
# `backend/__init__.py` to make `backend` a namespace package, has a blast radius
# across a 15,700-test suite and creates a shared namespace every future
# graduated seed collides in; `iam` graduates next under W2-T11.
#
# THE TREE KEEPS `backend/`. That is this repository's source layout, and
# `backend/README.md` and the boundary gate stay correct and unedited. Only what
# is BUILT and IMPORTED changes, which is the point rather than a compromise: the
# `backend.` prefix asserts "this lives inside a particular repository", and that
# is exactly the fact the move ends.
#
# THE CONSEQUENCE THE MOVE MUST CARRY: intra-package imports have to be RELATIVE
# (`from .envelope import Envelope`), never absolute-with-a-prefix. A relative
# import resolves under both names, which is what makes these two choices
# independent rather than merely reconciled. CTM's copies currently import each
# other as `from backend.esb_ig.envelope import ...`, and that spelling cannot
# survive installation: once this directory is `site-packages/esb_ig/`, there is
# no `backend` above it.
#
# PROVEN ON EVERY RUN, NEVER ASSERTED. `.github/workflows/ci.yml` installs this
# project into a clean virtualenv, runs from a directory that is NOT the repo
# root with `PYTHONPATH` cleared, imports `esb_ig`, and requires `__file__` to
# resolve inside that venv's site-packages. Installing and importing from the
# repo root would pass for the wrong reason — the source tree is on the path.
# The same step re-measures the ImportError above, so the reasoning is re-derived
# every run rather than quoted from a comment that can rot.

[build-system]
# REQUIRED, and a prerequisite of the consumption model rather than a nicety:
# without a build backend, `pip install git+https://...@<sha>` has nothing to
# build the wheel with. The first version of this file had none, on a "mirrors
# CTM" argument that does not carry here — CTM is never installed, and this
# repository now must be.
#
# Pinned exactly, on the same reasoning as `ruff` below: the build backend
# decides what ends up in the wheel, so an unpinned one makes the layout mapping
# further down depend on release timing. `wheel` is listed for explicitness;
# modern setuptools vendors what it needs to build one.
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "esb-ig"
version = "0.1.0"
description = "ESB/IG sub-system — the L4 mediation point: gateway and broker planes"
# CTM's CI runs 3.11.16 and this string is CTM's verbatim. The two trees are read
# together and moved between; a floor that differs by a digit is a difference
# somebody has to investigate before they can rule it harmless.
requires-python = ">=3.11"

[project.optional-dependencies]
# The AMQP driver for the broker plane. `pika` is what CTM's
# `backend/esb_ig/lib/rabbitmq.py` imports — read from that file, not assumed —
# and the major is pinned to CTM's floor (`requirements.txt`: `pika>=1.3`; the
# audited lock resolves 1.4.2). The upper bound stops a 2.x release changing the
# driver under a suite that has not arrived yet.
#
# IT IS AN EXTRA AND NOT A RUNTIME DEPENDENCY because CTM's module makes the
# driver import GUARDED AND LAZY: `import esb_ig` must succeed with no AMQP
# client installed, so a missing driver surfaces at connect time as
# `BrokerUnavailableError` rather than as an ImportError that takes the package
# down. The in-memory adapter and every semantic test need nothing.
#
# CI DOES NOT INSTALL IT into the gate environment. Nothing in this tree imports
# it yet, and installing a dependency no code reaches would make the extra read
# as exercised.
broker = ["pika>=1.3,<2"]

# The toolchain CI installs. It is read OUT OF THIS TABLE by the workflow rather
# than restated there — a second list of the same packages is a second rendering
# that can disagree with this one.
#
# `ruff` is pinned EXACTLY, and it is the only exact pin here. A formatter is the
# one tool whose output is its verdict: `ruff format --check` compares against
# whatever the installed version would produce, so an unpinned formatter makes a
# blocking lane's result depend on release timing rather than on the code. The
# linter's rule set moves for the same reason.
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff==0.15.16",
]

# ── packaging: the source-to-distribution mapping ────────────────────────────
# `where = ["backend"]` makes `backend/` the package root FOR THE BUILD ONLY, so
# `backend/esb_ig/` installs as top-level `esb_ig`. The tree is untouched.
#
# DISCOVERY RATHER THAN AN ENUMERATION, deliberately. The obvious spelling is
# `package-dir = {"esb_ig" = "backend/esb_ig"}` with one `packages` row per
# sub-package — and that list is hand-maintained, so the day the move adds
# `esb_ig/lib/` somebody has to remember to add a row, and a forgotten row ships
# a wheel missing a sub-package under a green build. CTM ADR-0015: the contract
# is the enumerated set, never a hand-kept copy of it, and the enumeration
# belongs to the tree. `include` keeps discovery narrow, so `backend/tests/` and
# any future sibling package are not swept in by accident.
#
# `namespaces = false` refuses to package a directory with no `__init__.py`. A
# missing `__init__.py` should be a build that omits the package loudly rather
# than one that silently ships a namespace portion.
[tool.setuptools.packages.find]
where = ["backend"]
include = ["esb_ig*"]
namespaces = false

# ── ruff ─────────────────────────────────────────────────────────────────────
# Copied from CTM's pyproject.toml so the suite that moves here under W2-T10
# lands on the rules it was written against. A rule that fires in one tree and
# not the other is read as a defect in the code rather than as a config drift.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F/W/I/N/UP = baseline. B/C4/PIE/RET add the high-signal correctness families.
# S (bandit) is deliberately absent — it runs as its own lane; duplicating it doubles the noise.
# RUF001-003 (ambiguous-unicode) stay off: this platform is bilingual EN/AR, so Arabic text
# makes them permanent false positives. Matches CTM and IAM, deliberately.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PIE", "RET", "RUF005", "RUF012"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these in argument defaults on purpose.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Body", "fastapi.Form", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

# ── pytest ───────────────────────────────────────────────────────────────────
# `testpaths` names a directory that must EXIST even while it is empty: pytest
# exits 4 (usage error) on a missing testpath and 5 (no tests collected) on an
# empty one, and only the second is the answer the CI lane knows how to read as
# NOT-RUN. `backend/tests/README.md` is what keeps the directory in git.
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "needs_broker: requires RabbitMQ via ESB_IG_TEST_BROKER_URL; CI asserts these do NOT skip",
    "slow: reaches a network service; deselect with -m 'not slow' for a fast inner loop",
]
# Coverage floor starts at 0 and is raised as the suite grows. A floor set above
# the measured figure before there is a suite to measure produces a permanently
# red gate that people learn to ignore (CTM ticket 01).
addopts = [
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
