name: esb-ig-ci

# Build gates for the ESB/IG sub-system.
#
# Every command here is the one the tree already documents — `CLAUDE.md` §3 and
# `backend/README.md`. A variant invented here would silently make the gate a
# different gate from the one people run locally.
#
# ⚠️ Branch protection is unavailable on this repository, exactly as on CTM's
# (platform `CLAUDE.md` §12, GOV-GATE: the API returns 403 — "Upgrade to GitHub
# Pro or make this repository public"). NOTHING here can technically block a
# merge. A red build is the only enforcement signal that exists. Never merge
# over red.
#
# WHAT THIS WORKFLOW DOES NOT PROVE, stated plainly because a green tick is read
# as proof of much more than it is:
#
#   * NO EVENT IS PRODUCED AND NOTHING IS TRANSPORTED. This repository holds a
#     catalogue, an ADR and two gates. The broker plane is still CTM's `esb_ig`
#     seed until W2-T10, and CTM's four `ctm.tenant.*` producers are held and
#     unbuilt. Adopting a name emits nothing.
#
#   * THERE IS NO SUITE. `backend/tests/` is empty. The Tests lane below reads
#     pytest's own exit 5 and reports NOT-RUN, which platform `CLAUDE.md` §11.3
#     says is not a pass. It is self-retiring: the first `test_*.py` to land
#     turns it into a blocking lane with nothing for anyone to switch on.
#
#   * THE BROKER IS PROVISIONED, NOT EXERCISED. A RabbitMQ 4 service container
#     runs and its port is probed. That is a claim about a container and a port
#     mapping. It is NOT the transport suite, which is the thing that would
#     observe redelivery, dead-letter routing and priority ordering — and which
#     does not exist here yet.
#
#   * NOTHING IS CROSS-CHECKED AGAINST CTM. `check_catalogue.py` deliberately
#     does not read CTM's document: a dual record whose halves are checked
#     against each other is one record in two files. The halves are meant to be
#     independently derivable and to disagree loudly.

on:
  push:
    # EVERY branch, deliberately, and copied from CTM's discipline rather than
    # composed here. CTM's filter used to read [main, master, "feature/**",
    # "security/**"] and the branch all of its wave 1 was built on matched none
    # of them, so the first thing a newly attached runner would have done is not
    # run. A branch filter that silently excludes the branch people work on is
    # the same defect class as a skipped test lane: green because nothing
    # happened (§11.3). This repository's own second branch is
    # `esb-ig-mediation-clearance`, which matches no conventional prefix either.
    branches: ["**"]

    # NO PATH FILTER, and its absence is a ruling rather than an omission — CTM
    # §14 TRIGGER-FILTERED, found 2026-09-01 and pinned there by
    # `backend/tests/test_ci_triggers.py`.
    #
    # CTM's read `paths-ignore: ["**.md", "roles/**", "wayfinder/**",
    # "Sprints/**", "References/**"]` and TWO OF ITS BLOCKING GATES READ NOTHING
    # BUT FILES IN THAT SET, so both lanes ran on the pushes that could not break
    # them and did not run on the pushes that could.
    #
    # THAT AIMS EVEN WORSE HERE. Everything this repository currently contains
    # except two scripts and one TOML file is markdown: the decision baseline,
    # the developed design, the ADR that adopts the envelope, the tickets. A
    # `**.md` filter reads as "skip documentation" and here means "skip the
    # commits that carry the decisions".
    #
    # A FILTERED PUSH IS WORSE THAN A SKIP. A skipped lane leaves a NOT-RUN
    # artefact and a row in the run list, and §11.3 has vocabulary for it. A push
    # that creates no run leaves nothing at all to read — no artefact, no red, no
    # row — and no instrument in this estate reports an absence of runs. CTM
    # found this when a commit fixing a red build by editing one `.md` scheduled
    # nothing: the fix for a build failure was invisible to the build.
    #
    # DELETED RATHER THAN NARROWED. A curated "safe to ignore" list is a second
    # rendering of what the gates read, and ADR-0015's rule is that two
    # renderings of one fact disagree. The price is runner minutes on
    # documentation-only pushes, which is the price `branches: ["**"]` already
    # pays.
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: esb-ig-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esb-ig-ci:
    runs-on: ubuntu-latest

    env:
      # `backend.*` importable as a package, `scripts.*` likewise. Nothing here
      # is pip-installed — see `pyproject.toml` on why there is no build-system.
      PYTHONPATH: ${{ github.workspace }}

      # THE POINT OF THE SERVICE CONTAINER, ahead of the suite that will read it.
      # The transport tests that graduate here under W2-T10 skip when this is
      # unset, and §11.3 says a skip is not-run rather than a pass — so
      # provisioning the broker now is what makes the day they land a move rather
      # than a move plus an infrastructure change.
      #
      # Not `guest:guest`: CTM's `backend/esb_ig/lib/config.py` refuses the
      # shipped default pair, so a suite moving here would refuse this URL. A
      # workflow people copy from should not teach the shape that config
      # validator exists to remove. A literal throwaway pair is acceptable in a
      # service container precisely because it is not a deployment.
      ESB_IG_TEST_BROKER_URL: amqp://esb_ig_ci:esb-ig-ci-throwaway-not-a-deployment@localhost:5672/

    services:
      # The broker the transport suite needs. It is here BEFORE that suite is,
      # which is the whole intent of this seed: the mediation plane is what ESB/IG
      # is for, and standing the server up is the half that cannot be done by
      # moving files.
      rabbitmq:
        # PINNED BY DIGEST, and the digest is REUSED FROM CTM's `ci.yml` rather
        # than re-resolved. CTM records it as `rabbitmq:4` as the registry
        # resolved it on 2026-08-29, verified to carry linux/amd64. Re-resolving
        # the tag here would produce a digest with no provenance anybody in this
        # estate can cite, and — worse — would mean the two repositories claim to
        # test against "RabbitMQ 4" while running two different images.
        image: rabbitmq@sha256:f3aa266b9f3ee3d06c6658804aa3b8e4474bfc18880dcc20f469995a728c298b
        env:
          RABBITMQ_DEFAULT_USER: esb_ig_ci
          RABBITMQ_DEFAULT_PASS: esb-ig-ci-throwaway-not-a-deployment
        ports:
          - 5672:5672
        # The health check is what makes container liveness a precondition of the
        # steps rather than something a probe has to establish: Actions holds the
        # job until this passes or fails it outright.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # CTM's CI runs 3.11.16 and `pyproject.toml` declares `>=3.11`. The two
          # trees are moved between; a runner on a different minor would make a
          # red here need investigating before it could be ruled a real defect.
          python-version: "3.11"
          cache: pip
          # Named explicitly: the default pip cache key globs for
          # `requirements.txt`, and this repository has none by design.
          cache-dependency-path: pyproject.toml

      # The toolchain is READ OUT OF `pyproject.toml`'s `dev` extra rather than
      # restated here. A second list of the same packages is a second rendering
      # of one fact, and ADR-0015's rule is that two renderings disagree — the
      # way they disagree here is that a developer adds a tool locally and the
      # runner silently does not have it.
      #
      # `pip install .[dev]` is not available: there is no build-system, for the
      # reason `pyproject.toml` records. `tomllib` is stdlib from 3.11.
      #
      # THE BROKER EXTRA IS DELIBERATELY NOT INSTALLED. Nothing in this tree
      # imports `pika`, and installing it would make the extra read as exercised.
      - name: Install the dev toolchain
        id: install
        run: |
          python - <<'PY' > dev-requirements.txt
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in pyproject["project"]["optional-dependencies"]["dev"]:
              print(requirement)
          PY
          echo "--- derived from pyproject.toml [project.optional-dependencies].dev ---"
          cat dev-requirements.txt

          # AN EMPTY FILE HERE INSTALLS NOTHING AND EXITS 0. The heredoc above is
          # a redirect, so a raised tomllib error (malformed pyproject, renamed
          # group) still creates `dev-requirements.txt` — empty — and
          # `pip install -r` on an empty file succeeds. Every lane after this
          # would then fail on "ruff: command not found", which reads as a broken
          # toolchain rather than as a broken config, and `steps.install.outcome`
          # would say `success`. Fail here instead, where the cause is.
          if [ ! -s dev-requirements.txt ]; then
            echo "FAIL: derived no dev requirements from pyproject.toml — is [project.optional-dependencies].dev still there?" >&2
            exit 1
          fi

          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt

      # ── Lint and format ──────────────────────────────────────────────────────
      # `ruff` is pinned exactly in the `dev` extra. A formatter's output IS its
      # verdict, so an unpinned one makes this lane's result depend on release
      # timing rather than on the code.
      - name: Lint (ruff) — BLOCKING
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check backend scripts

      - name: Format (ruff format --check) — BLOCKING
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check backend scripts

      # ── Evidence artefacts (§11.3) ───────────────────────────────────────────
      # §11.3: gates are evaluated from committed machine-readable artefacts —
      # "a pass recorded in prose is not evidence". This step only PRODUCES the
      # evidence; the blocking decisions are the two steps after it, so the `||
      # true` here cannot mask a failure, and neither can a redirect swallowing
      # an exit code.
      #
      # THE TWO GATES EMIT TO DIFFERENT PLACES and that is not an oversight to be
      # tidied: `check_boundary.py --json` prints to stdout, so it is redirected;
      # `check_catalogue.py --json` writes `evidence/gate-catalogue.json`, a
      # committed path, because that artefact is the adoption's evidence and
      # lives in the tree rather than only at the wire.
      - name: Evidence artefacts — NON-BLOCKING (the gates below decide)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python scripts/check_boundary.py --json > gate-boundary.json || true
          python scripts/check_catalogue.py --json || true

      - name: Boundary gate (N3 / deep modules) — BLOCKING
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_boundary.py

      # Adoption is a claim and this is the instrument — `docs/adr/0001` adopts
      # CTM's ADR-0038 and an adoption recorded only in an ADR is a sentence.
      # Exit 2 is a CONTROL FAILURE (the negative control stopped firing), which
      # is a different repair from a finding and is why it is a separate code.
      - name: Catalogue gate (envelope · axis rule) — BLOCKING
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_catalogue.py

      # WITHOUT THIS STEP THE COMMITTED ARTEFACT IS A SECOND RENDERING WITH
      # NOTHING RECONCILING IT. The evidence step above regenerated
      # `evidence/gate-catalogue.json` in the workspace and the upload carries
      # that fresh copy — but the copy IN THE TREE, which is what a reader opens
      # and what §11.3 calls the evidence, is never compared to it and never
      # written back. So a catalogue edit that moves `types_judged`, or a change
      # to `not_verified_here`, leaves the committed artefact describing a run
      # that no longer happens, under a green tick. That is ADR-0015's defect
      # exactly, and CTM has a whole gate for the class.
      #
      # The reconciliation is `git diff` rather than a new script: the fresh copy
      # is already on disk, so the comparison is free and there is nothing to
      # keep in step. Line endings are normalised by `.gitattributes` (`* text=
      # auto`), which is what makes a byte-for-byte diff safe across platforms.
      #
      # The remedy when this reddens is to run `python scripts/check_catalogue.py
      # --json` and commit the result — never to edit the JSON, which would make
      # the artefact a third rendering. The failure message says so, because a
      # gate that fails without naming a remedy teaches people to work around it.
      - name: Committed catalogue evidence is current — BLOCKING
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if ! git diff --exit-code -- evidence/gate-catalogue.json; then
            echo "FAIL: evidence/gate-catalogue.json in the tree disagrees with a fresh run of the gate." >&2
            echo "Remedy: python scripts/check_catalogue.py --json, then commit the result. Do not hand-edit the JSON." >&2
            exit 1
          fi
          echo "evidence/gate-catalogue.json matches a fresh run."

      # ── The distributed import name ──────────────────────────────────────────
      # THE ONE CLAIM WHOSE FAILURE MODE IS DISCOVERED ON THE DAY OF THE MOVE.
      # CTM will delete its `backend/esb_ig/` seed and pin this repository as a
      # dependency; if the built distribution does not import as `esb_ig`, the
      # graduation does not build, and nothing before that moment would have said
      # so. So it is PROVEN here rather than asserted in a comment.
      #
      # THREE THINGS MAKE THIS A PROOF RATHER THAN A REHEARSAL, and each of them
      # is a way the same step passes for the wrong reason if it is left out:
      #   * A CLEAN VIRTUALENV, so nothing already on the runner can satisfy the
      #     import.
      #   * A WORKING DIRECTORY THAT IS NOT THE REPO ROOT. Python puts the script's
      #     directory on `sys.path`; run from the repo root, `backend/` is
      #     reachable and the SOURCE tree answers the import.
      #   * `PYTHONPATH` CLEARED. The job sets it to the workspace so `backend.*`
      #     resolves for the gates; inherited here it would put the source tree
      #     back on the path, which is exactly the contamination the other two
      #     guard against.
      # It then requires `esb_ig.__file__` to resolve INSIDE that venv's
      # site-packages — an import that merely succeeds proves nothing about where
      # it came from.
      #
      # AND IT RE-MEASURES THE REASON. `pyproject.toml` records why the name is
      # not `backend.esb_ig`: CTM ships `backend/__init__.py`, so `backend` is a
      # regular package, its `__path__` is fixed to CTM's own directory, and an
      # installed distribution providing `backend/esb_ig/` is never searched for.
      # That is quoted in a comment, and a comment can rot — so the shadowing is
      # rebuilt from two throwaway directories on every run and the ImportError
      # is required to happen. A ruling whose ground is only written down is a
      # ruling nobody re-checks.
      - name: The distributed import name is `esb_ig` — BLOCKING
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        env:
          # Cleared deliberately — see the note above. This is the line that
          # stops the proof answering from the source tree.
          PYTHONPATH: ""
        run: |
          set -euo pipefail

          python -m venv /tmp/proof-venv
          /tmp/proof-venv/bin/python -m pip install --quiet --disable-pip-version-check --upgrade pip
          /tmp/proof-venv/bin/python -m pip install --quiet --disable-pip-version-check "$GITHUB_WORKSPACE"

          # NOT the repo root. `cd /tmp` is load-bearing, not tidiness.
          cd /tmp
          /tmp/proof-venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import pathlib
          import sys
          import sysconfig
          import tempfile

          failures = []

          # ── the positive claim ────────────────────────────────────────────
          import esb_ig

          module_file = pathlib.Path(esb_ig.__file__).resolve()
          site_packages = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          installed_from_site_packages = site_packages in module_file.parents
          if not installed_from_site_packages:
              failures.append(
                  f"esb_ig resolved to {module_file}, which is not inside {site_packages} — "
                  "the import was answered by a source tree on the path, not by the installed "
                  "distribution."
              )

          distribution = metadata.distribution("esb-ig")
          top_level = sorted((distribution.read_text("top_level.txt") or "").split())
          if top_level != ["esb_ig"]:
              failures.append(f"the distribution publishes {top_level}, expected ['esb_ig']")

          # ── the negative control: why the name is not `backend.esb_ig` ─────
          # Rebuild CTM's shape from two throwaway directories — a regular
          # `backend` package in one, a would-be installed `backend/esb_ig` in
          # the other — and require the ImportError. A control that cannot fire
          # and one that has never fired are indistinguishable in an exit code.
          with tempfile.TemporaryDirectory() as scratch:
              root = pathlib.Path(scratch)
              (root / "a" / "backend").mkdir(parents=True)
              (root / "a" / "backend" / "__init__.py").write_text("", encoding="utf-8")
              (root / "b" / "backend" / "esb_ig").mkdir(parents=True)
              (root / "b" / "backend" / "esb_ig" / "__init__.py").write_text("", encoding="utf-8")

              sys.path.insert(0, str(root / "b"))
              sys.path.insert(0, str(root / "a"))
              import backend

              searched = [str(entry) for entry in backend.__path__]
              try:
                  import backend.esb_ig  # noqa: F401
              except ImportError as exc:
                  shadowing_detail = f"{type(exc).__name__}: {exc}"
              else:
                  shadowing_detail = ""
                  failures.append(
                      "CONTROL FAILURE: backend.esb_ig imported through a regular `backend` "
                      "package. The ground pyproject.toml records for the naming ruling no "
                      "longer holds, and the ruling has to be revisited rather than trusted."
                  )

          report = {
              "gate": "distributed-import-name",
              "outcome": "proven" if not failures else "failed",
              "distributed_import_name": "esb_ig",
              "source_directory": "backend/esb_ig/",
              "distribution": f"esb-ig {metadata.version('esb-ig')}",
              "resolved_from": str(module_file),
              "site_packages": str(site_packages),
              "imported_from_site_packages": installed_from_site_packages,
              "cwd_is_not_the_repo_root": str(pathlib.Path.cwd()),
              "negative_control": {
                  "subject": "backend.esb_ig under a regular `backend` package (CTM's shape)",
                  "backend_dunder_path": searched,
                  "fired": bool(shadowing_detail),
                  "detail": shadowing_detail,
              },
              "failures": failures,
              "not_verified_here": [
                  "NO MODULE OF SUBSTANCE IS IMPORTED. esb_ig publishes nothing yet; the "
                  "envelope, broker protocol and transport are CTM's until W2-T10. This proves "
                  "the packaging contract, never that the package does anything.",
                  "THE CONSUMER SIDE IS NOT EXERCISED. CTM is not installed here and no "
                  "`from esb_ig import ...` in CTM's wiring is compiled against this wheel.",
                  "INTRA-PACKAGE IMPORTS ARE NOT CHECKED, because there are none yet. The move "
                  "must bring RELATIVE imports: an absolute `from backend.esb_ig.x import y` "
                  "cannot resolve once the directory is site-packages/esb_ig/, and this lane "
                  "would go red on the day it arrived rather than before.",
              ],
          }

          # Written back into the workspace, not into /tmp where this is running:
          # the upload step collects artefacts from the repo root.
          artefact = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "gate-import-name.json"
          artefact.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))

          if failures:
              for failure in failures:
                  print(f"FAIL: {failure}", file=sys.stderr)
              raise SystemExit(1)
          print(f"PROVEN: import esb_ig resolves to {module_file}")
          PY

      # ── The broker ───────────────────────────────────────────────────────────
      # WHAT THIS IS: a check that the service container's port is reachable from
      # the job. The `--health-cmd` above already gates the job on the broker
      # being alive INSIDE its container; the one fact this adds is that the port
      # mapping into the job works, which is the half that would otherwise fail
      # for the first time on the day the suite arrives.
      #
      # WHAT THIS IS NOT: the transport suite. It opens a TCP connection and
      # closes it. It speaks no AMQP, publishes nothing, and observes none of the
      # three semantics a real broker exists to prove — redelivery after an
      # unacknowledged consumer crash, server-side dead-letter routing, priority
      # ordering across two concurrent consumers. Those need a suite that is not
      # here, and its artefact says so in `not_verified_here` so a green cannot
      # be read as transport evidence.
      - name: Broker port reachability — NOT the transport suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import socket
          import sys
          import urllib.parse

          # Read from the environment, not interpolated by the workflow expression
          # engine: the URL the suite will read is the one this probe must reach,
          # and two spellings of it is one spelling too many.
          url = urllib.parse.urlparse(os.environ["ESB_IG_TEST_BROKER_URL"])
          host, port = url.hostname, url.port
          try:
              with socket.create_connection((host, port), timeout=15):
                  outcome, detail = "reachable", f"opened and closed a TCP connection to {host}:{port}"
          except OSError as exc:
              outcome, detail = "unreachable", f"{type(exc).__name__}: {exc}"

          report = {
              "gate": "broker-reachability",
              "outcome": outcome,
              "detail": detail,
              "image": "rabbitmq@sha256:f3aa266b9f3ee3d06c6658804aa3b8e4474bfc18880dcc20f469995a728c298b",
              "not_verified_here": [
                  "NO AMQP IS SPOKEN. This opens a socket. It does not connect as a client, "
                  "declare a queue, publish, or consume.",
                  "THE THREE SEMANTICS ARE NOT OBSERVED — redelivery after an unacknowledged "
                  "consumer crash, server-side dead-letter routing, priority ordering across two "
                  "concurrent consumers. Those are what a server performs and a fake cannot fake, "
                  "and they need the transport suite that graduates here under W2-T10.",
                  "NO DRIVER IS INSTALLED. `pika` is an extra and CI does not install it, because "
                  "nothing in this tree imports it yet.",
              ],
          }
          pathlib.Path("gate-broker.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          # A declared container whose port does not reach the job is a real defect
          # and fails the build. Discovering it on the day the suite lands would
          # read as the suite being broken.
          sys.exit(0 if outcome == "reachable" else 1)
          PY

      # ── Tests ────────────────────────────────────────────────────────────────
      # THE LANE READS PYTEST'S OWN EXIT CODE and nothing else. Exit 5 is "no
      # tests collected"; anything else is the real verdict and is passed
      # straight through, so a red suite is a red build from the first test
      # onwards.
      #
      # WHY NOT A PRE-CHECK for `test_*.py` files: that would be a second reading
      # of "is there a suite", and two readings of one fact disagree. Pytest's
      # answer is the only one that cannot drift from what pytest then does.
      #
      # `backend/tests/` MUST EXIST for this to work — pytest exits 4 (usage
      # error) on a missing `testpaths` and 5 on an empty one, and only the
      # second is an answer this lane can honestly render. `backend/tests/
      # README.md` is what keeps the directory in git.
      #
      # NOT-RUN IS NOT A PASS (§11.3). The step exits 0 so the build reflects the
      # gates that DID run, and it writes an artefact whose `outcome` says
      # `not-run` and raises a workflow warning, so the absence is visible in the
      # run summary rather than inferred from a green tick.
      - name: Tests — BLOCKING once a suite exists, NOT-RUN until then
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          python -m pytest -q -rA | tee test-suite.txt
          status=${PIPESTATUS[0]}
          set -e

          case "$status" in
            5) outcome="not-run"
               detail="pytest collected no tests under testpaths backend/tests (exit 5). NOT-RUN is not a pass."
               ;;
            0) outcome="passed"
               detail="the suite ran and nothing failed"
               ;;
            *) outcome="failed"
               detail="pytest exited $status"
               ;;
          esac

          cat > gate-tests.json <<JSON
          {
            "gate": "tests",
            "outcome": "$outcome",
            "detail": "$detail",
            "pytest_exit_code": $status,
            "not_verified_here": [
              "WHILE THE OUTCOME IS not-run, NOTHING ABOUT THIS SUB-SYSTEM IS TESTED HERE. The envelope, the broker protocol and the transport adapter all still live in CTM's tree and graduate under W2-T10.",
              "This lane is self-retiring: the first test_*.py under backend/tests turns it blocking with no configuration change. A not-run outcome after that date would mean the suite was deleted, not that none was written."
            ]
          }
          JSON
          cat gate-tests.json

          if [ "$status" -eq 5 ]; then
            echo "::warning title=Tests NOT-RUN::No suite exists under backend/tests. Platform CLAUDE.md 11.3: not-run is not a pass."
            echo "### Tests: NOT-RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "pytest collected no tests under \`backend/tests\` (exit 5). **NOT-RUN is not a pass** (platform \`CLAUDE.md\` §11.3)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      # `if-no-files-found: error`, NOT `warn`: a missing artefact means a gate
      # did not run, and §11.3 says not-run is not a pass. Warning on it is how
      # partial evidence gets mistaken for complete evidence.
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esb-ig-gate-evidence
          path: |
            gate-boundary.json
            gate-broker.json
            gate-import-name.json
            gate-tests.json
            test-suite.txt
            evidence/gate-catalogue.json
          if-no-files-found: error
